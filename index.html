<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>山海夜市 - Web Survivor</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/app/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 游戏主画布容器 -->
      <div id="game-container"></div>

      <!-- 竖屏建议横屏提示 -->
      <div id="portrait-hint" class="portrait-hint">📱 建议旋转手机为横屏以获得全屏最佳体验</div>

      <!-- 启动与手势解锁层 -->
      <div id="start-overlay" class="overlay">
        <div class="modal-card">
          <div class="badge">Shanhai Night Market</div>
          <h1 class="title">山 海 夜 市</h1>
          <p class="subtitle">幽冥小怪夜袭，化厨具为神兵！构筑你的战斗厨房！</p>
          <div class="controls-hint">
            <div><span>[W/A/S/D]</span> 或 <span>[方向键]</span> 移动</div>
            <div><span>[Esc]</span> 暂停 | 移动端支持跟手虚拟摇杆</div>
          </div>
          <button id="start-btn" class="btn primary-btn">进入夜市营业</button>
          <div class="version-tag" id="app-version-tag">v0.1.0</div>
        </div>
      </div>

      <!-- 全局错误边界 -->
      <div id="error-boundary" class="overlay hidden">
        <div class="modal-card error-card">
          <h2 class="error-title">⚠️ 运行异常</h2>
          <p id="error-message" class="error-text">发生了意外错误。</p>
          <pre id="error-stack" class="error-stack"></pre>
          <button id="reload-btn" class="btn">重新加载游戏</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
